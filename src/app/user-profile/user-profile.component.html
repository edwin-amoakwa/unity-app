<app-page-header
  title="Profile"
  description="Your account details and SMS pricing"
></app-page-header>

<div class="row">
  <div class="col-sm-12">
    <app-card>
      @if (user) {
        <div>
          <div class="row mb-3">
            <div class="col-md-3">
              <strong>Account Name:</strong>
            </div>
            <div class="col-md-9">
              {{ user.accountName }}
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-3">
              <strong>Email Address:</strong>
            </div>
            <div class="col-md-9">
              {{ user.emailAddress }}
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-3">
              <strong>Phone Number:</strong>
            </div>
            <div class="col-md-9">
              {{ user.phoneNo || "Not provided" }}
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-3">
              <strong>Account Category:</strong>
            </div>
            <div class="col-md-9">
              <span class="badge bg-primary">{{ user.accountCategory }}</span>
            </div>
          </div>
        </div>
      }
    </app-card>
